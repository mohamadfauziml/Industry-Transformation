<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Transformation Mission</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Fraunces:wght@700;900&amp;display=swap" rel="stylesheet">
  <style>
        :root {
            --navy: #0a1628;
            --navy-light: #132042;
            --navy-mid: #1a2d5a;
            --cyan: #00e5ff;
            --cyan-dim: #00b8d4;
            --gold: #ffd700;
            --gold-dim: #b8960c;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: #e0e8f0; }
        h1,h2,h3 { font-family: 'Fraunces', serif; }
        .glow-cyan { box-shadow: 0 0 20px rgba(0,229,255,0.15); }
        .glow-gold { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .card { background: var(--navy-light); border: 1px solid rgba(0,229,255,0.2); border-radius: 12px; }
        .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--cyan-dim)); color: var(--navy); font-weight: 700; border-radius: 8px; padding: 12px 24px; transition: transform 0.15s, box-shadow 0.15s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,229,255,0.3); }
        .btn-secondary { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); font-weight: 600; border-radius: 8px; padding: 10px 20px; transition: all 0.15s; }
        .btn-secondary:hover { background: rgba(0,229,255,0.1); }
        .drag-item { background: var(--navy-mid); border: 1px solid rgba(0,229,255,0.3); border-radius: 8px; padding: 12px 16px; cursor: grab; transition: all 0.2s; user-select: none; }
        .drag-item:active { cursor: grabbing; transform: scale(1.03); }
        .drag-item.selected { border-color: var(--cyan); background: rgba(0,229,255,0.1); }
        .drop-zone { border: 2px dashed rgba(0,229,255,0.3); border-radius: 12px; min-height: 60px; transition: all 0.2s; }
        .drop-zone.over { border-color: var(--cyan); background: rgba(0,229,255,0.05); }
        .tech-card { background: var(--navy-mid); border: 2px solid transparent; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .tech-card:hover { border-color: rgba(0,229,255,0.5); }
        .tech-card.chosen { border-color: var(--cyan); background: rgba(0,229,255,0.1); }
        .tech-card.correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .tech-card.incorrect { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--navy-mid); border: 2px solid rgba(0,229,255,0.3); transition: all 0.3s; }
        .progress-dot.active { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .progress-dot.completed { background: var(--gold); border-color: var(--gold); }
        .stmt-chip { background: var(--navy-mid); border: 1px solid rgba(0,229,255,0.2); border-radius: 20px; padding: 8px 16px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .stmt-chip:hover { border-color: var(--cyan); }
        .stmt-chip.selected { background: rgba(0,229,255,0.15); border-color: var(--cyan); }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .flow-node { background: var(--navy-mid); border: 1px solid var(--cyan); border-radius: 8px; padding: 8px 14px; font-size: 13px; text-align: center; opacity: 0; transition: opacity 0.5s, transform 0.5s; transform: scale(0.8); }
        .flow-node.visible { opacity: 1; transform: scale(1); }
        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; }
            .flow-node { transition: none; }
        }
    </style>
  
  
 </head>
 <body data-template-id="__page-root" class="min-h-screen" style="background: rgb(10, 22, 40);">
  <div class="w-full max-w-4xl mx-auto px-4 py-6"><!-- Progress Bar -->
   <nav id="progress-bar" class="hidden mb-6" aria-label="Mission progress">
    <div class="flex items-center justify-center gap-2">
     <div class="progress-dot" data-stage="1" aria-label="Stage 1"></div>
     <div class="w-8 h-0.5 bg-gray-700"></div>
     <div class="progress-dot" data-stage="2" aria-label="Stage 2"></div>
     <div class="w-8 h-0.5 bg-gray-700"></div>
     <div class="progress-dot" data-stage="3" aria-label="Stage 3"></div>
     <div class="w-8 h-0.5 bg-gray-700"></div>
     <div class="progress-dot" data-stage="4" aria-label="Stage 4"></div>
    </div>
   </nav><!-- Screens Container -->
   <main id="app" aria-live="polite"></main>
  </div>
  
  <script>
    (function() {
        // Game State
        let state = {
            screen: 'briefing',
            stage1: { selected: [], submitted: false, score: 0 },
            stage2: { order: [], submitted: false, score: 0 },
            stage3: { answers: [null, null, null], submitted: [false, false, false], score: 0 },
            stage4: { selectedImprovements: [], selectedIoT: false, submitted: false, score: 0 },
            reflection: '',
            reviewMode: false
        };

        const ISSUES = [
            { id: 'breakdowns', text: 'Unexpected machine failures', priority: true },
            { id: 'manual', text: 'Manual production reporting', priority: true },
            { id: 'energy', text: 'High electricity consumption', priority: false },
            { id: 'inventory', text: 'Inventory shortages', priority: true },
            { id: 'defects', text: 'Late defect detection', priority: false },
            { id: 'visibility', text: 'Lack of management visibility', priority: false }
        ];

        const CORRECT_ORDER = ['breakdowns', 'manual', 'inventory'];

        const TECH_SCENARIOS = [
            {
                problem: 'Unexpected machine failures',
                correct: 0,
                options: ['IoT Sensors + Predictive Maintenance', 'Additional workers', 'Manual inspections', 'Paper maintenance forms'],
                feedback: 'Continuous sensor data enables predictive maintenance before failure occurs. IoT sensors monitor vibration, temperature, and performance patterns to predict breakdowns.',
                wrongFeedback: 'Manual approaches are reactive — they detect problems after they occur. Industry 4.0 uses continuous data to prevent failures proactively.'
            },
            {
                problem: 'Manual production reporting',
                correct: 0,
                options: ['IoT Sensors + Real-Time Dashboard', 'Weekly reports', 'More supervisors', 'Paper forms'],
                feedback: 'IoT enables continuous production visibility. Connected sensors feed real-time data to dashboards, eliminating reporting delays and human error.',
                wrongFeedback: 'Adding people or paper processes cannot achieve real-time visibility. Only connected digital systems provide instant production data.'
            },
            {
                problem: 'Inventory shortages',
                correct: 0,
                options: ['RFID + Connected Inventory System', 'Increase warehouse size', 'Weekly stock count', 'Telephone reporting'],
                feedback: 'RFID automatically tracks inventory movement and supports real-time stock monitoring. Connected systems trigger alerts and reorders automatically.',
                wrongFeedback: 'Larger warehouses or periodic counts do not prevent shortages. Only automatic, continuous tracking with connected systems ensures real-time inventory accuracy.'
            }
        ];

        const IMPROVEMENTS = [
            { id: 'downtime', text: 'Reduced unplanned downtime', correct: true },
            { id: 'visibility', text: 'Real-time production visibility', correct: true },
            { id: 'predictive', text: 'Predictive maintenance capability', correct: true },
            { id: 'inventory', text: 'Automated inventory tracking', correct: true },
            { id: 'decision', text: 'Faster decision making', correct: true },
            { id: 'efficiency', text: 'Improved production efficiency', correct: true },
            { id: 'wrong1', text: 'Reduced employee count by 50%', correct: false },
            { id: 'wrong2', text: 'Elimination of all human oversight', correct: false },
            { id: 'wrong3', text: 'Zero production costs', correct: false }
        ];

        const IOT_STATEMENT = 'Industry 4.0 creates the technological foundation for IoT by combining sensors, communication networks, cloud computing, intelligent analysis, and connected devices that exchange information automatically.';
        const IOT_OPTIONS = [
            { id: 'iot_correct', text: IOT_STATEMENT, correct: true },
            { id: 'iot_wrong1', text: 'Industry 4.0 replaces all workers with robots that do not need communication networks.', correct: false },
            { id: 'iot_wrong2', text: 'IoT was invented before Industry 4.0 and operates independently without cloud computing.', correct: false }
        ];

        const app = document.getElementById('app');
        const progressBar = document.getElementById('progress-bar');

        function getTotalScore() {
            return state.stage1.score + state.stage2.score + state.stage3.score + state.stage4.score;
        }

        function getPerformanceLevel(score) {
            if (score >= 90) return { title: 'Chief Digital Transformation Consultant', color: 'text-yellow-400' };
            if (score >= 75) return { title: 'Senior Industry 4.0 Consultant', color: 'text-cyan-400' };
            if (score >= 60) return { title: 'Transformation Analyst', color: 'text-blue-400' };
            return { title: 'Junior Consultant', color: 'text-gray-400' };
        }

        function updateProgress(activeStage) {
            progressBar.classList.remove('hidden');
            progressBar.querySelectorAll('.progress-dot').forEach(dot => {
                const s = parseInt(dot.dataset.stage);
                dot.classList.remove('active', 'completed');
                if (s < activeStage) dot.classList.add('completed');
                else if (s === activeStage) dot.classList.add('active');
            });
        }

        function render() {
            switch(state.screen) {
                case 'briefing': renderBriefing(); break;
                case 'howtoplay': renderHowToPlay(); break;
                case 'profile': renderProfile(); break;
                case 'stage1': renderStage1(); break;
                case 'stage2': renderStage2(); break;
                case 'stage3': renderStage3(); break;
                case 'stage4': renderStage4(); break;
                case 'animation': renderAnimation(); break;
                case 'report': renderReport(); break;
                case 'reflection': renderReflection(); break;
                case 'completion': renderCompletion(); break;
            }
            if (['stage1','stage2','stage3','stage4'].includes(state.screen)) {
                updateProgress(parseInt(state.screen.charAt(5)));
            } else {
                progressBar.classList.add('hidden');
            }
        }

        function renderBriefing() {
            app.innerHTML = `
                <div class="fade-in text-center">
                    <p class="text-cyan-400 uppercase tracking-widest text-sm mb-2">Mission 4</p>
                    <h1 class="text-3xl md:text-4xl font-black text-white mb-6">Industry Transformation Mission</h1>
                    <div class="card glow-cyan p-6 md:p-8 text-left max-w-2xl mx-auto mb-8">
                        <p class="text-gray-300 mb-4">Congratulations.</p>
                        <p class="text-gray-300 mb-4">Your previous investigations successfully reconstructed the history of industrial development, compared the four Industrial Revolutions, and modernised individual factory operations.</p>
                        <p class="text-gray-300 mb-4">The Board of Directors has now appointed you as <strong class="text-cyan-300">Lead Industry 4.0 Transformation Consultant</strong>.</p>
                        <p class="text-gray-300">Your final responsibility is to design a complete digital transformation strategy for an ageing manufacturing company.</p>
                    </div>
                    <div class="card p-6 max-w-2xl mx-auto mb-8 text-left">
                        <h2 class="text-lg font-bold text-cyan-400 mb-4">Mission Objectives</h2>
                        <ul class="space-y-2 text-gray-300">
                            <li class="flex gap-2"><i data-lucide="target" class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5"></i>Analyse the factory</li>
                            <li class="flex gap-2"><i data-lucide="list-ordered" class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5"></i>Prioritise operational issues</li>
                            <li class="flex gap-2"><i data-lucide="cpu" class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5"></i>Recommend Industry 4.0 technologies</li>
                            <li class="flex gap-2"><i data-lucide="wifi" class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5"></i>Explain IoT integration</li>
                            <li class="flex gap-2"><i data-lucide="presentation" class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5"></i>Present a complete transformation proposal</li>
                        </ul>
                    </div>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <button class="btn-primary" onclick="game.navigate('profile')">Start Mission</button>
                        <button class="btn-secondary" onclick="game.navigate('howtoplay')">How to Play</button>
                    </div>
                </div>`;
            lucide.createIcons();
        }

        function renderHowToPlay() {
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <h2 class="text-2xl font-bold text-white mb-6">How to Play</h2>
                    <div class="card p-6 space-y-4 text-gray-300">
                        <p><strong class="text-cyan-300">Stage 1 — Factory Diagnosis:</strong> Identify the 3 most critical issues from 6 operational problems by clicking to select them.</p>
                        <p><strong class="text-cyan-300">Stage 2 — Priority Planning:</strong> Arrange your selected priorities in the correct order by clicking to reorder.</p>
                        <p><strong class="text-cyan-300">Stage 3 — Technology Recommendation:</strong> Choose the best Industry 4.0 solution for each problem.</p>
                        <p><strong class="text-cyan-300">Stage 4 — Executive Presentation:</strong> Build your final consultancy report by selecting correct statements.</p>
                        <p class="text-yellow-400"><strong>Scoring:</strong> Stage 1 (25pts) + Stage 2 (25pts) + Stage 3 (30pts) + Stage 4 (20pts) = 100 total</p>
                    </div>
                    <button class="btn-primary mt-6" onclick="game.navigate('briefing')">← Back to Briefing</button>
                </div>`;
        }

        function renderProfile() {
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <h2 class="text-2xl font-bold text-white mb-2">Client Profile</h2>
                    <div class="card glow-cyan p-6 mb-6">
                        <div class="flex items-start gap-4 mb-4">
                            <img src="https://images.pexels.com/photos/3846559/pexels-photo-3846559.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Manufacturing factory" loading="lazy" class="w-24 h-24 rounded-lg object-cover shrink-0">
                            <div>
                                <h3 class="text-xl font-bold text-white">Apex Precision Manufacturing</h3>
                                <p class="text-cyan-400 text-sm">Precision component manufacturing</p>
                                <p class="text-gray-400 text-sm">280 employees</p>
                            </div>
                        </div>
                        <h4 class="text-sm font-bold text-cyan-400 uppercase tracking-wide mb-2">Current Production System</h4>
                        <ul class="text-gray-300 text-sm space-y-1 mb-4">
                            <li>• Conventional automation</li>
                            <li>• Manual reporting</li>
                            <li>• Reactive maintenance</li>
                            <li>• Disconnected systems</li>
                        </ul>
                        <h4 class="text-sm font-bold text-cyan-400 uppercase tracking-wide mb-2">Current Problems</h4>
                        <ul class="text-gray-300 text-sm space-y-1 mb-4">
                            <li>✓ Unexpected machine failures</li>
                            <li>✓ Manual production monitoring</li>
                            <li>✓ High electricity consumption</li>
                            <li>✓ Inventory shortages</li>
                            <li>✓ Late defect detection</li>
                            <li>✓ No integrated production dashboard</li>
                        </ul>
                        <blockquote class="border-l-4 border-cyan-400 pl-4 italic text-gray-300">"Our management wants to become a smart factory within two years."</blockquote>
                    </div>
                    <button class="btn-primary" onclick="game.navigate('stage1')">Begin Diagnosis →</button>
                </div>`;
            lucide.createIcons();
        }

        function renderStage1() {
            const isReview = state.reviewMode;
            const submitted = state.stage1.submitted;
            const selected = state.stage1.selected;
            const correctIds = ISSUES.filter(i => i.priority).map(i => i.id);

            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white">Stage 1: Factory Diagnosis</h2>
                        <span class="text-sm text-cyan-400">25 points</span>
                    </div>
                    <p class="text-gray-300 mb-4">Identify the <strong class="text-cyan-300">3 most critical</strong> operational issues that directly interrupt production and information flow.</p>
                    <div class="space-y-3 mb-6" id="issues-list">
                        ${ISSUES.map(issue => {
                            const isSel = selected.includes(issue.id);
                            const isCorrect = correctIds.includes(issue.id);
                            let extraClass = '';
                            if (submitted || isReview) {
                                if (isSel && isCorrect) extraClass = 'border-green-500 bg-green-900/20';
                                else if (isSel && !isCorrect) extraClass = 'border-red-500 bg-red-900/20';
                                else if (!isSel && isCorrect) extraClass = 'border-yellow-500 bg-yellow-900/10';
                            } else if (isSel) {
                                extraClass = 'selected';
                            }
                            const disabled = (submitted || isReview) ? 'pointer-events-none' : '';
                            return `<button class="drag-item w-full text-left flex items-center gap-3 ${extraClass} ${disabled}" onclick="game.toggleIssue('${issue.id}')" aria-pressed="${isSel}">
                                <span class="w-6 h-6 rounded-full border-2 ${isSel ? 'bg-cyan-400 border-cyan-400' : 'border-gray-500'} shrink-0 flex items-center justify-center">
                                    ${isSel ? '<i data-lucide="check" class="w-4 h-4 text-navy"></i>' : ''}
                                </span>
                                <span>${issue.text}</span>
                                ${(submitted || isReview) && isCorrect ? '<span class="ml-auto text-xs text-green-400">Critical</span>' : ''}
                            </button>`;
                        }).join('')}
                    </div>
                    ${submitted || isReview ? `
                        <div class="card p-4 mb-4 border-l-4 ${state.stage1.score === 25 ? 'border-green-500' : 'border-yellow-500'}">
                            <p class="text-sm text-gray-300"><strong class="text-white">Feedback:</strong> Machine breakdowns, manual reporting, and inventory shortages directly interrupt production flow and information availability. Energy costs, defect detection, and visibility are important but secondary — they become easier to solve once the primary issues are addressed.</p>
                            <p class="text-sm text-cyan-400 mt-2">Score: ${state.stage1.score}/25</p>
                        </div>
                        ${!isReview ? '<button class="btn-primary" onclick="game.navigate(\'stage2\')">Continue to Priority Planning →</button>' : '<button class="btn-secondary" onclick="game.navigate(\'report\')">← Back to Report</button>'}
                    ` : `
                        <button class="btn-primary ${selected.length !== 3 ? 'opacity-50 cursor-not-allowed' : ''}" onclick="game.submitStage1()" ${selected.length !== 3 ? 'disabled' : ''}>Submit Diagnosis (${selected.length}/3 selected)</button>
                    `}
                </div>`;
            lucide.createIcons();
        }

        function renderStage2() {
            const isReview = state.reviewMode;
            const submitted = state.stage2.submitted;
            let items = state.stage2.order.length ? state.stage2.order : [...state.stage1.selected];
            if (!state.stage2.order.length) state.stage2.order = items;

            const labels = { breakdowns: 'Unexpected machine failures', manual: 'Manual production reporting', inventory: 'Inventory shortages' };
            const explanations = [
                'Machine availability affects every downstream process.',
                'Real-time production visibility supports operational decisions.',
                'Inventory optimisation becomes more effective once reliable production data is available.'
            ];

            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white">Stage 2: Priority Planning</h2>
                        <span class="text-sm text-cyan-400">25 points</span>
                    </div>
                    <p class="text-gray-300 mb-4">Arrange the three critical issues in order of priority. Which should be addressed <strong class="text-cyan-300">first</strong>?</p>
                    <div class="space-y-3 mb-6" id="rank-list">
                        ${items.map((id, idx) => {
                            const correctPos = CORRECT_ORDER.indexOf(id);
                            let extraClass = '';
                            if (submitted || isReview) {
                                extraClass = idx === correctPos ? 'border-green-500 bg-green-900/20' : 'border-red-500 bg-red-900/20';
                            }
                            const disabled = (submitted || isReview) ? 'pointer-events-none' : '';
                            return `<div class="drag-item flex items-center gap-3 ${extraClass} ${disabled}">
                                <span class="w-8 h-8 rounded-full bg-cyan-400/20 text-cyan-400 font-bold flex items-center justify-center shrink-0">${idx + 1}</span>
                                <span class="flex-1">${labels[id]}</span>
                                ${!(submitted || isReview) ? `<div class="flex flex-col gap-1">
                                    <button class="text-gray-400 hover:text-cyan-400 p-1" onclick="game.moveRank(${idx},-1)" aria-label="Move up" ${idx===0?'disabled':''}><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                                    <button class="text-gray-400 hover:text-cyan-400 p-1" onclick="game.moveRank(${idx},1)" aria-label="Move down" ${idx===items.length-1?'disabled':''}><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                                </div>` : ''}
                            </div>`;
                        }).join('')}
                    </div>
                    ${submitted || isReview ? `
                        <div class="card p-4 mb-4 border-l-4 ${state.stage2.score === 25 ? 'border-green-500' : 'border-yellow-500'}">
                            <p class="text-sm font-bold text-white mb-2">Correct Order:</p>
                            ${CORRECT_ORDER.map((id, i) => `<p class="text-sm text-gray-300 mb-1"><strong class="text-cyan-300">${i+1}. ${labels[id]}</strong> — ${explanations[i]}</p>`).join('')}
                            <p class="text-sm text-cyan-400 mt-2">Score: ${state.stage2.score}/25</p>
                        </div>
                        ${!isReview ? '<button class="btn-primary" onclick="game.navigate(\'stage3\')">Continue to Technology Recommendation →</button>' : '<button class="btn-secondary" onclick="game.navigate(\'report\')">← Back to Report</button>'}
                    ` : `
                        <button class="btn-primary" onclick="game.submitStage2()">Submit Priority Order</button>
                    `}
                </div>`;
            lucide.createIcons();
        }

        function renderStage3() {
            const isReview = state.reviewMode;
            // Find current scenario
            let currentIdx = 0;
            if (!isReview) {
                for (let i = 0; i < 3; i++) {
                    if (!state.stage3.submitted[i]) { currentIdx = i; break; }
                    if (i === 2) currentIdx = 2;
                }
            }

            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white">Stage 3: Technology Recommendation</h2>
                        <span class="text-sm text-cyan-400">30 points</span>
                    </div>
                    ${isReview ? renderStage3Review() : renderStage3Scenario(currentIdx)}
                </div>`;
            lucide.createIcons();
        }

        function renderStage3Scenario(idx) {
            const scenario = TECH_SCENARIOS[idx];
            const submitted = state.stage3.submitted[idx];
            const chosen = state.stage3.answers[idx];

            return `
                <p class="text-gray-400 text-sm mb-2">Scenario ${idx+1} of 3</p>
                <div class="card p-4 mb-4">
                    <p class="text-sm text-cyan-400 uppercase tracking-wide mb-1">Problem</p>
                    <p class="text-white font-bold">${scenario.problem}</p>
                </div>
                <p class="text-gray-300 mb-3">Select the best Industry 4.0 solution:</p>
                <div class="grid gap-3 mb-6">
                    ${scenario.options.map((opt, i) => {
                        let cls = 'tech-card';
                        if (submitted) {
                            if (i === scenario.correct) cls += ' correct';
                            else if (i === chosen) cls += ' incorrect';
                        } else if (i === chosen) cls += ' chosen';
                        const disabled = submitted ? 'pointer-events-none' : '';
                        return `<button class="${cls} ${disabled}" onclick="game.selectTech(${idx},${i})" aria-pressed="${i === chosen}">
                            <span class="flex items-center gap-2">
                                ${submitted && i === scenario.correct ? '<i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>' : ''}
                                ${submitted && i === chosen && i !== scenario.correct ? '<i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i>' : ''}
                                <span>${opt}</span>
                            </span>
                        </button>`;
                    }).join('')}
                </div>
                ${!submitted ? `<button class="btn-primary ${chosen === null ? 'opacity-50 cursor-not-allowed' : ''}" onclick="game.submitTech(${idx})" ${chosen === null ? 'disabled' : ''}>Confirm Recommendation</button>` : `
                    <div class="card p-4 mb-4 border-l-4 ${chosen === scenario.correct ? 'border-green-500' : 'border-red-500'}">
                        <p class="text-sm text-gray-300">${chosen === scenario.correct ? scenario.feedback : scenario.wrongFeedback}</p>
                    </div>
                    ${idx < 2 ? `<button class="btn-primary" onclick="game.nextTech(${idx})">Next Scenario →</button>` : `<button class="btn-primary" onclick="game.navigate('stage4')">Continue to Executive Presentation →</button>`}
                `}`;
        }

        function renderStage3Review() {
            return TECH_SCENARIOS.map((scenario, idx) => {
                const chosen = state.stage3.answers[idx];
                return `
                    <div class="card p-4 mb-4">
                        <p class="text-sm text-cyan-400 mb-1">Scenario ${idx+1}: ${scenario.problem}</p>
                        <p class="text-sm text-gray-300">Your answer: <span class="${chosen === scenario.correct ? 'text-green-400' : 'text-red-400'}">${scenario.options[chosen]}</span></p>
                        <p class="text-sm text-gray-300">Correct: <span class="text-green-400">${scenario.options[scenario.correct]}</span></p>
                        <p class="text-sm text-gray-400 mt-1">${scenario.feedback}</p>
                    </div>`;
            }).join('') + `<p class="text-cyan-400 text-sm mb-4">Score: ${state.stage3.score}/30</p><button class="btn-secondary" onclick="game.navigate('report')">← Back to Report</button>`;
        }

        function renderStage4() {
            const isReview = state.reviewMode;
            const submitted = state.stage4.submitted;

            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white">Stage 4: Executive Presentation</h2>
                        <span class="text-sm text-cyan-400">20 points</span>
                    </div>
                    <p class="text-gray-300 mb-6">Build your final consultancy report. Select the correct expected improvements and IoT explanation.</p>

                    <div class="card p-4 mb-4">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wide mb-3">Section C: Expected Improvements</h3>
                        <p class="text-xs text-gray-400 mb-3">Select all improvements that apply (6 correct):</p>
                        <div class="flex flex-wrap gap-2">
                            ${IMPROVEMENTS.map(imp => {
                                const isSel = state.stage4.selectedImprovements.includes(imp.id);
                                let cls = 'stmt-chip';
                                if (submitted || isReview) {
                                    if (imp.correct && isSel) cls += ' border-green-500 bg-green-900/20';
                                    else if (!imp.correct && isSel) cls += ' border-red-500 bg-red-900/20';
                                    else if (imp.correct && !isSel) cls += ' border-yellow-500';
                                } else if (isSel) cls += ' selected';
                                const disabled = (submitted || isReview) ? 'pointer-events-none' : '';
                                return `<button class="${cls} ${disabled}" onclick="game.toggleImprovement('${imp.id}')">${imp.text}</button>`;
                            }).join('')}
                        </div>
                    </div>

                    <div class="card p-4 mb-6">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wide mb-3">Section D: How Industry 4.0 Enables IoT</h3>
                        <p class="text-xs text-gray-400 mb-3">Select the correct explanation:</p>
                        <div class="space-y-3">
                            ${IOT_OPTIONS.map(opt => {
                                const isSel = state.stage4.selectedIoT === opt.id;
                                let cls = 'tech-card text-sm text-left';
                                if (submitted || isReview) {
                                    if (opt.correct) cls += ' correct';
                                    else if (isSel && !opt.correct) cls += ' incorrect';
                                } else if (isSel) cls += ' chosen';
                                const disabled = (submitted || isReview) ? 'pointer-events-none' : '';
                                return `<button class="${cls} ${disabled}" onclick="game.selectIoT('${opt.id}')">${opt.text}</button>`;
                            }).join('')}
                        </div>
                    </div>

                    ${submitted || isReview ? `
                        <div class="card p-4 mb-4 border-l-4 border-cyan-400">
                            <p class="text-sm text-gray-300">Your presentation demonstrates understanding of Industry 4.0's role in enabling IoT connectivity across the manufacturing environment.</p>
                            <p class="text-sm text-cyan-400 mt-2">Score: ${state.stage4.score}/20</p>
                        </div>
                        ${!isReview ? '<button class="btn-primary" onclick="game.navigate(\'animation\')">View Factory Transformation →</button>' : '<button class="btn-secondary" onclick="game.navigate(\'report\')">← Back to Report</button>'}
                    ` : `
                        <button class="btn-primary" onclick="game.submitStage4()">Submit Presentation</button>
                    `}
                </div>`;
        }

        function renderAnimation() {
            const nodes = ['Machine', 'Sensor', 'Network', 'Cloud', 'Analytics', 'Decision', 'Improved Production'];
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto text-center">
                    <h2 class="text-2xl font-bold text-white mb-6">Smart Factory Transformation</h2>
                    <div class="card p-6 mb-6">
                        <div class="flex items-center justify-center gap-2 mb-8">
                            <div class="text-center px-3 py-2 rounded bg-gray-800 text-gray-400 text-xs">Traditional<br>Factory</div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-cyan-400"></i>
                            <div class="text-center px-3 py-2 rounded bg-cyan-900/30 border border-cyan-700 text-cyan-300 text-xs">Connected<br>Factory</div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-gold"></i>
                            <div class="text-center px-3 py-2 rounded bg-yellow-900/30 border border-yellow-600 text-yellow-300 text-xs">Smart<br>Factory</div>
                        </div>
                        <p class="text-sm text-cyan-400 uppercase tracking-wide mb-4">Data Flow</p>
                        <div class="flex flex-wrap items-center justify-center gap-2" id="flow-nodes">
                            ${nodes.map((n, i) => `<div class="flow-node" id="flow-${i}">${n}</div>${i < nodes.length-1 ? '<i data-lucide="chevron-right" class="w-4 h-4 text-cyan-400 opacity-0" id="arrow-${i}"></i>' : ''}`).join('')}
                        </div>
                    </div>
                    <button class="btn-primary" onclick="game.navigate('report')">View Consultancy Report →</button>
                </div>`;
            lucide.createIcons();
            // Animate nodes
            nodes.forEach((_, i) => {
                setTimeout(() => {
                    const node = document.getElementById(`flow-${i}`);
                    if (node) node.classList.add('visible');
                    if (i > 0) {
                        const arrow = document.getElementById(`arrow-${i-1}`);
                        if (arrow) arrow.style.opacity = '1';
                    }
                }, 300 * (i + 1));
            });
        }

        function renderReport() {
            const total = getTotalScore();
            const perf = getPerformanceLevel(total);
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <div class="text-center mb-6">
                        <p class="text-cyan-400 uppercase tracking-widest text-xs mb-1">Final Consultancy Report</p>
                        <h2 class="text-2xl font-bold text-white">Lead Industry 4.0 Transformation Consultant</h2>
                    </div>
                    <div class="card glow-gold p-6 text-center mb-6">
                        <p class="text-5xl font-black text-white mb-2">${total}<span class="text-lg text-gray-400">/100</span></p>
                        <p class="text-lg font-bold ${perf.color}">${perf.title}</p>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                        <div class="card p-3 text-center"><p class="text-xs text-gray-400">Diagnosis</p><p class="text-lg font-bold text-white">${state.stage1.score}/25</p></div>
                        <div class="card p-3 text-center"><p class="text-xs text-gray-400">Planning</p><p class="text-lg font-bold text-white">${state.stage2.score}/25</p></div>
                        <div class="card p-3 text-center"><p class="text-xs text-gray-400">Technology</p><p class="text-lg font-bold text-white">${state.stage3.score}/30</p></div>
                        <div class="card p-3 text-center"><p class="text-xs text-gray-400">Presentation</p><p class="text-lg font-bold text-white">${state.stage4.score}/20</p></div>
                    </div>
                    <div class="card p-4 mb-6">
                        <h3 class="text-sm font-bold text-cyan-400 mb-2">Digital Transformation Roadmap</h3>
                        <div class="space-y-2 text-sm text-gray-300">
                            <p>1. IoT Sensors + Predictive Maintenance → Eliminate unplanned downtime</p>
                            <p>2. IoT Sensors + Real-Time Dashboard → Enable production visibility</p>
                            <p>3. RFID + Connected Inventory → Automate stock management</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 mb-4">
                        <button class="btn-secondary text-sm" onclick="game.review('stage1')"><i data-lucide="eye" class="w-4 h-4 inline"></i> Review Stage 1</button>
                        <button class="btn-secondary text-sm" onclick="game.review('stage2')"><i data-lucide="eye" class="w-4 h-4 inline"></i> Review Stage 2</button>
                        <button class="btn-secondary text-sm" onclick="game.review('stage3')"><i data-lucide="eye" class="w-4 h-4 inline"></i> Review Stage 3</button>
                        <button class="btn-secondary text-sm" onclick="game.review('stage4')"><i data-lucide="eye" class="w-4 h-4 inline"></i> Review Stage 4</button>
                    </div>
                    <button class="btn-primary" onclick="game.navigate('reflection')">Continue to Reflection →</button>
                </div>`;
            lucide.createIcons();
        }

        function renderReflection() {
            const submitted = state.reflection.length >= 60;
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto">
                    <h2 class="text-xl font-bold text-white mb-4">Reflection</h2>
                    <div class="card p-6 mb-6">
                        <p class="text-gray-300 mb-4">If you could implement only <strong class="text-cyan-300">ONE</strong> Industry 4.0 technology in this factory, which would you choose?</p>
                        <p class="text-sm text-gray-400 mb-3">Explain: the technology, the operational problem it solves, the IoT connection, and the business benefit.</p>
                        <textarea id="reflection-input" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-200 min-h-[150px] focus:border-cyan-400 focus:outline-none" placeholder="Write your reflection here (minimum 60 characters)..." oninput="game.updateReflection(this.value)">${state.reflection}</textarea>
                        <p class="text-xs text-gray-500 mt-2"><span id="char-count">${state.reflection.length}</span>/60 characters minimum</p>
                    </div>
                    <button class="btn-primary ${state.reflection.length < 60 ? 'opacity-50 cursor-not-allowed' : ''}" onclick="game.navigate('completion')" ${state.reflection.length < 60 ? 'disabled' : ''}>Complete Mission →</button>
                </div>`;
        }

        function renderCompletion() {
            const total = getTotalScore();
            const perf = getPerformanceLevel(total);
            app.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto text-center">
                    <div class="mb-6">
                        <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center mb-4 glow-gold">
                            <i data-lucide="award" class="w-10 h-10 text-navy"></i>
                        </div>
                        <h2 class="text-3xl font-black text-white mb-2">Mission 4 Completed</h2>
                        <p class="text-lg ${perf.color} font-bold">${perf.title}</p>
                        <p class="text-4xl font-black text-white mt-2">${total}/100</p>
                    </div>
                    <div class="card p-6 text-left mb-6">
                        <p class="text-gray-300">You successfully analysed a manufacturing company, prioritised its operational challenges, selected appropriate Industry 4.0 technologies, and delivered a complete digital transformation strategy demonstrating how Industry 4.0 provides the foundation for IoT.</p>
                    </div>
                    <p class="text-sm text-gray-400 italic mb-6">Mission completed. Return to the main portal to continue your learning journey.</p>
                    <div class="flex flex-wrap gap-3 justify-center">
                        <button class="btn-secondary" onclick="game.navigate('report')"><i data-lucide="file-text" class="w-4 h-4 inline"></i> Review Consultancy Report</button>
                        <button class="btn-secondary" onclick="game.replay()"><i data-lucide="rotate-ccw" class="w-4 h-4 inline"></i> Replay Mission</button>
                        <button class="btn-primary opacity-60 cursor-not-allowed" onclick="alert('The main portal link will be added after all missions are published.')" title="The main portal link will be added after all missions are published."><i data-lucide="home" class="w-4 h-4 inline"></i> Return to Main Portal</button>
                    </div>
                    <p class="text-xs text-gray-500 mt-3">The main portal link will be added after all missions are published.</p>
                </div>`;
            lucide.createIcons();
        }

        // Game Logic
        window.game = {
            navigate(screen) {
                state.screen = screen;
                state.reviewMode = false;
                render();
                window.scrollTo(0, 0);
            },
            review(stage) {
                state.reviewMode = true;
                state.screen = stage;
                render();
                window.scrollTo(0, 0);
            },
            toggleIssue(id) {
                if (state.stage1.submitted) return;
                const idx = state.stage1.selected.indexOf(id);
                if (idx > -1) state.stage1.selected.splice(idx, 1);
                else if (state.stage1.selected.length < 3) state.stage1.selected.push(id);
                render();
            },
            submitStage1() {
                if (state.stage1.selected.length !== 3) return;
                state.stage1.submitted = true;
                const correctIds = ISSUES.filter(i => i.priority).map(i => i.id);
                const correct = state.stage1.selected.filter(id => correctIds.includes(id)).length;
                state.stage1.score = Math.round((correct / 3) * 25);
                render();
            },
            moveRank(idx, dir) {
                const newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= state.stage2.order.length) return;
                const temp = state.stage2.order[idx];
                state.stage2.order[idx] = state.stage2.order[newIdx];
                state.stage2.order[newIdx] = temp;
                render();
            },
            submitStage2() {
                state.stage2.submitted = true;
                let correct = 0;
                state.stage2.order.forEach((id, i) => { if (id === CORRECT_ORDER[i]) correct++; });
                state.stage2.score = Math.round((correct / 3) * 25);
                render();
            },
            selectTech(scenario, option) {
                if (state.stage3.submitted[scenario]) return;
                state.stage3.answers[scenario] = option;
                render();
            },
            submitTech(scenario) {
                if (state.stage3.answers[scenario] === null) return;
                state.stage3.submitted[scenario] = true;
                if (state.stage3.answers[scenario] === TECH_SCENARIOS[scenario].correct) {
                    state.stage3.score += 10;
                }
                render();
            },
            nextTech(idx) {
                render();
            },
            toggleImprovement(id) {
                if (state.stage4.submitted) return;
                const idx = state.stage4.selectedImprovements.indexOf(id);
                if (idx > -1) state.stage4.selectedImprovements.splice(idx, 1);
                else state.stage4.selectedImprovements.push(id);
                render();
            },
            selectIoT(id) {
                if (state.stage4.submitted) return;
                state.stage4.selectedIoT = id;
                render();
            },
            submitStage4() {
                state.stage4.submitted = true;
                let score = 0;
                // Improvements: 6 correct ones
                const correctImps = IMPROVEMENTS.filter(i => i.correct).map(i => i.id);
                const selectedCorrect = state.stage4.selectedImprovements.filter(id => correctImps.includes(id)).length;
                const selectedWrong = state.stage4.selectedImprovements.filter(id => !correctImps.includes(id)).length;
                score += Math.max(0, Math.round(((selectedCorrect - selectedWrong) / 6) * 12));
                // IoT: 8 points
                if (state.stage4.selectedIoT === 'iot_correct') score += 8;
                state.stage4.score = Math.min(20, score);
                render();
            },
            updateReflection(val) {
                state.reflection = val;
                const count = document.getElementById('char-count');
                if (count) count.textContent = val.length;
                const btn = document.querySelector('.btn-primary');
                if (btn) {
                    if (val.length >= 60) { btn.classList.remove('opacity-50','cursor-not-allowed'); btn.disabled = false; }
                    else { btn.classList.add('opacity-50','cursor-not-allowed'); btn.disabled = true; }
                }
            },
            replay() {
                state = {
                    screen: 'briefing',
                    stage1: { selected: [], submitted: false, score: 0 },
                    stage2: { order: [], submitted: false, score: 0 },
                    stage3: { answers: [null, null, null], submitted: [false, false, false], score: 0 },
                    stage4: { selectedImprovements: [], selectedIoT: false, submitted: false, score: 0 },
                    reflection: '',
                    reviewMode: false
                };
                render();
                window.scrollTo(0, 0);
            }
        };

        render();
        lucide.createIcons();
    })();
    </script>
 
</body></html>
